<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professeur Kem – PX-19 : Le Script</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper: #f5f5f0;
    --ink: #111;
    --accent: #222;
    --grey: #666;
    --light-grey: #aaa;
  }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Courier Prime', monospace;
  }

  #scene {
    perspective: 2000px;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  #book-wrapper {
    position: relative;
    width: 700px; height: 500px;
    transform-style: preserve-3d;
    transform: scale(1.2);
  }

  #cover-container {
    position: absolute;
    width: 350px; height: 500px;
    left: 175px;
    transform-origin: left center;
    transform-style: preserve-3d;
    z-index: 100;
    cursor: pointer;
    transition: filter 0.3s;
  }
  #cover-container:hover { filter: brightness(1.08); }

  .cover-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 2px 6px 6px 2px;
    overflow: hidden;
  }
  .cover-front {
    background: #000;
    border: 1px solid #333;
    box-shadow: 4px 0 24px rgba(0,0,0,0.9), inset -3px 0 10px rgba(0,0,0,0.6);
    overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 30px 24px;
  }
  .cover-back {
    transform: rotateY(180deg);
    background: #000;
    border: 1px solid #222;
    display: flex; align-items: center; justify-content: center;
  }

  .cover-click-hint {
    position: absolute; bottom: -34px; left: 50%; transform: translateX(-50%);
    font-family: 'Special Elite', cursive; font-size: 11px;
    color: #888; letter-spacing: 2px;
    animation: pulse-hint 2s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes pulse-hint { 0%,100%{ opacity:0.4; } 50%{ opacity:1; } }

  .cover-spine {
    position: absolute;
    left: -14px; top: 0; width: 14px; height: 500px;
    background: linear-gradient(90deg, #000, #111, #000);
    border-left: 1px solid #000;
    border-right: 1px solid #222;
    transform: rotateY(-90deg) translateX(-7px);
    transform-origin: right center;
  }

  #pages-stack {
    position: absolute;
    left: 50%; top: 0;
    width: 350px; height: 500px;
    background: linear-gradient(90deg, #ddd, #f5f5f0 10%, #eee 90%, #ccc);
    border-radius: 0 6px 6px 0;
    box-shadow: 6px 4px 20px rgba(0,0,0,0.4);
    overflow: hidden;
    display: none;
  }

  #left-page {
    position: absolute;
    left: 0; top: 0;
    width: 350px; height: 500px;
    background: var(--paper);
    border-right: 1px solid #ccc;
    overflow: hidden;
    box-shadow: inset -6px 0 12px rgba(0,0,0,0.05);
    display: none;
  }

  #flip-container {
    position: absolute;
    left: 50%; top: 0;
    width: 350px; height: 500px;
    transform-origin: left center;
    transform-style: preserve-3d;
    transform: rotateY(0deg);
    transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1.000);
    z-index: 10;
    pointer-events: none;
    display: none;
  }

  .flip-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    overflow: hidden;
  }
  #flip-front { background: var(--paper); box-shadow: inset -4px 0 12px rgba(0,0,0,0.07); }
  #flip-back  { background: var(--paper); transform: rotateY(180deg); box-shadow: inset 4px 0 12px rgba(0,0,0,0.07); }

  .page-content {
    width: 100%; height: 100%;
    padding: 26px 28px 20px;
    position: relative;
    display: flex; flex-direction: column;
    background: var(--paper);
  }

  .page-number {
    position: absolute; bottom: 10px;
    font-family: 'Courier Prime', monospace; font-size: 10px;
    color: var(--grey); letter-spacing: 1px;
  }
  .page-number.left  { left: 28px; }
  .page-number.right { right: 28px; }

  /* Script formatting */
  .script-header {
    font-family: 'Special Elite', cursive;
    font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--grey);
    margin-bottom: 6px;
    border-bottom: 1px solid #ccc;
    padding-bottom: 4px;
  }
  .script-title {
    font-family: 'Courier Prime', monospace;
    font-size: 13px; font-weight: 700;
    color: var(--ink);
    margin-bottom: 12px; line-height: 1.2;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .script-body {
    font-family: 'Courier Prime', monospace;
    font-size: 10.5px; line-height: 1.7;
    color: var(--ink);
    flex: 1; overflow: hidden;
  }
  .scene-heading {
    font-weight: 700;
    text-transform: uppercase;
    margin: 8px 0 4px;
    font-size: 10px;
    letter-spacing: 0.5px;
  }
  .action {
    margin-bottom: 6px;
    color: #222;
  }
  .character {
    text-align: center;
    font-weight: 700;
    text-transform: uppercase;
    margin-top: 8px; margin-bottom: 0;
    font-size: 10.5px;
  }
  .dialogue {
    margin: 0 30px 6px;
    color: #333;
    font-style: italic;
    font-size: 10px;
    line-height: 1.5;
  }
  .parenthetical {
    margin: 0 40px 2px;
    color: var(--grey);
    font-size: 9.5px;
  }
  .divider {
    text-align: center; color: #bbb;
    font-size: 12px; margin: 6px 0;
    letter-spacing: 6px;
  }

  #nav-prev, #nav-next {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,0.08);
    border: 1px solid #bbb;
    color: #666;
    width: 36px; height: 60px;
    cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s; z-index: 200;
    font-family: serif; user-select: none;
  }
  #nav-prev { left: -52px; border-radius: 6px 0 0 6px; }
  #nav-next { right: -52px; border-radius: 0 6px 6px 0; }
  #nav-prev:hover, #nav-next:hover { background: rgba(0,0,0,0.15); }
  #nav-prev.hidden, #nav-next.hidden { opacity:0; pointer-events:none; }

  #page-indicator {
    position: absolute; bottom: -44px; left: 50%; transform: translateX(-50%);
    font-family: 'Courier Prime', monospace; font-size: 11px;
    color: #888; letter-spacing: 2px;
    white-space: nowrap;
  }

  #cover-container.opening {
    animation: cover-open 1.35s cubic-bezier(0.46, 0.03, 0.30, 1) forwards;
    pointer-events: none;
  }
  @keyframes cover-open {
    0%   { transform: rotateY(0deg); }
    100% { transform: rotateY(-178deg); }
  }
  #cover-container.opened {
    transform: rotateY(-178deg);
    pointer-events: none;
  }

  .cover-front { transition: box-shadow 0.4s; }
  #cover-container.opening .cover-front {
    box-shadow: 14px 0 40px rgba(0,0,0,0.55), inset -3px 0 10px rgba(0,0,0,0.08);
  }

  #pages-stack.revealing, #flip-container.revealing {
    animation: half-reveal 0.5s ease-out forwards;
  }
  @keyframes half-reveal {
    0%   { opacity: 0; }
    100% { opacity: 1; }
  }
</style>
</head>

<script>
const spreads = [

  {
    left: `<div class="script-header">PX-19 — Script — Page de titre</div>
<div class="script-body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;">
<div style="font-size:11px;color:#aaa;letter-spacing:3px;margin-bottom:16px;">LOS SANTOS PICTURES PRÉSENTE</div>
<div style="font-size:22px;font-weight:700;letter-spacing:3px;margin-bottom:6px;">PX-19</div>
<div style="font-size:11px;color:#666;margin-bottom:4px;font-style:italic;">ou comment Psycho a raté la bombe</div>
<div style="font-size:10px;color:#aaa;margin-bottom:24px;">sur Cayo Perico</div>
<div style="width:40px;height:1px;background:#ccc;margin:0 auto 20px;"></div>
<div style="font-size:9px;color:#aaa;letter-spacing:2px;">Écrit par le Professeur Kem</div>
<div style="font-size:9px;color:#bbb;margin-top:6px;">Premier jet — usage interne</div>
</div>
<div class="page-number left">i</div>`,

    right: `<div class="script-header">Note d'intention</div>
<div class="script-title">Pourquoi ce Film</div>
<div class="script-body">
<div class="action">Ce script est basé sur des faits réels. Enfin. Presque. Disons qu'il est basé sur des faits réels légèrement dramatisés, quelques inexactitudes scientifiques volontaires, et beaucoup de mauvaise foi de la part des personnages principaux.</div>
<div class="divider">* * *</div>
<div class="action">Le Professeur Kem tient à préciser que PX-19 est une bactérie totalement inoffensive qu'il a découverte en 2019 dans les fonds de Cayo Perico. Ce film n'est pas de sa faute.</div>
<div class="action">Ce qui suit est une reconstitution des événements qui ont conduit Los Santos à bombarder une île entière à cause d'une bactérie incapable de faire du mal à un moustique.</div>
<div class="action">Le Professeur Kem a approuvé ce projet sous la contrainte.</div>
</div>
<div class="page-number right">ii</div>`
  },

  {
    left: `<div class="script-header">Acte I — Scène 1</div>
<div class="script-title">La Découverte</div>
<div class="script-body">
<div class="scene-heading">EXT. BAIE DE CAYO PERICO — JOUR</div>
<div class="action">Un bateau de recherche. Mer calme. Le PROFESSEUR KEM, 50 ans, barbe en désordre, lunettes de travers, remonte une carotte de sédiment à 340 mètres de profondeur. Il observe un truc verdâtre collé au bout.</div>
<div class="character">KEM</div>
<div class="parenthetical">(regardant l'échantillon avec émerveillement)</div>
<div class="dialogue">Fascinant. Une nouvelle espèce bactérienne. Anaérobie stricte. Bioluminescente. Et totalement inoffensive.</div>
<div class="character">ASSISTANT (O.S.)</div>
<div class="dialogue">Professeur, vous devriez peut-être ne pas appeler ça PX-19. Ça fait un peu... apocalyptique.</div>
<div class="character">KEM</div>
<div class="dialogue">P pour Perico. X pour inconnu. 19 pour 2019. C'est de la nomenclature, pas un film catastrophe.</div>
<div class="action">Silence gêné de l'assistant.</div>
</div>
<div class="page-number left">1</div>`,

    right: `<div class="script-header">Acte I — Scène 2</div>
<div class="script-body">
<div class="scene-heading">INT. LABORATOIRE — UNIVERSITÉ DE LOS SANTOS — NUIT</div>
<div class="action">Kem observe ses cultures sous microscope. La bactérie émet une faible lueur bleue-verte pendant quelques secondes. C'est beau. C'est scientifique. Ce n'est absolument pas dangereux.</div>
<div class="character">KEM</div>
<div class="parenthetical">(prenant des notes)</div>
<div class="dialogue">Aucune pathogénicité. Aucune toxine. Elle meurt au contact de l'oxygène. Elle ne ferait pas de mal à une salades de concombres.</div>
<div class="action">Son téléphone sonne. Un numéro masqué.</div>
<div class="character">KEM</div>
<div class="dialogue">Allo ?</div>
<div class="character">VOIX MYSTÉRIEUSE</div>
<div class="dialogue">Professeur Kem. Nous avons lu vos notes sur le PX-19.</div>
<div class="character">KEM</div>
<div class="dialogue">Elles sont confidentielles. Comment vous les avez eues ?</div>
<div class="character">VOIX MYSTÉRIEUSE</div>
<div class="dialogue">On a nos méthodes.</div>
<div class="action">Il raccroche. Kem reste figé.</div>
</div>
<div class="page-number right">2</div>`
  },

  {
    left: `<div class="script-header">Acte II — Scène 3</div>
<div class="script-title">Holixxod s'en mêle</div>
<div class="script-body">
<div class="scene-heading">INT. BUREAU DE PRODUCTION — HOLIXXOD — LOS SANTOS</div>
<div class="action">Un producteur CHAD MERCER, 40 ans, costume blanc, lunettes de soleil en intérieur, fait les cent pas devant un tableau de pitch.</div>
<div class="character">MERCER</div>
<div class="dialogue">On fait une série. Une bactérie des fonds marins. Elle transforme les gens en zombies. L'île explose à la fin. On l'appelle ZERO HOUR.</div>
<div class="character">SCÉNARISTE</div>
<div class="dialogue">Mais... la vraie bactérie est inoffensive d'après les notes qu'on a volées.</div>
<div class="character">MERCER</div>
<div class="parenthetical">(sans s'arrêter)</div>
<div class="dialogue">On s'en fout. Les gens veulent des zombies. On met des zombies.</div>
<div class="character">SCÉNARISTE</div>
<div class="dialogue">Et le Professeur Kem ?</div>
<div class="character">MERCER</div>
<div class="dialogue">On lui envoie un chèque. S'il refuse, on dit que c'est de la fiction.</div>
</div>
<div class="page-number left">3</div>`,

    right: `<div class="script-header">Acte II — Scène 4</div>
<div class="script-body">
<div class="scene-heading">INT. APPARTEMENT DE KEM — NUIT</div>
<div class="action">Kem regarde le premier épisode de ZERO HOUR sur Holixxod. On voit à l'écran une bactérie "PX-19" se répandre par voie aérienne et transformer les habitants d'une île en créatures hostiles. Kem se lève lentement du canapé.</div>
<div class="character">KEM</div>
<div class="parenthetical">(voix calme, effrayante)</div>
<div class="dialogue">PX-19 est anaérobie stricte. Elle meurt en dix minutes à l'air libre. Elle ne se transmet pas par voie aérienne. Elle ne transforme personne en rien du tout.</div>
<div class="action">Il regarde la caméra.</div>
<div class="character">KEM</div>
<div class="dialogue">Je vais écrire un script pour corriger ça.</div>
<div class="action">Fondus au noir. Titre : "Ce que vous venez de voir, c'est le script de Kem. La suite, c'est ce qui s'est vraiment passé après."</div>
</div>
<div class="page-number right">4</div>`
  },

  {
    left: `<div class="script-header">Acte II — Scène 5</div>
<div class="script-title">L'Escalade</div>
<div class="script-body">
<div class="scene-heading">INT. MAIRIE DE LOS SANTOS — SALLE DE CRISE</div>
<div class="action">Réunion d'urgence. Le MAIRE, en sueur, face à une projection montrant une carte de Cayo Perico entourée de rouge clignotant. Autour de la table : des généraux, des conseillers, et PSYCHO — un contractuel militaire en survêtement, l'air très concentré sur son téléphone.</div>
<div class="character">MAIRE</div>
<div class="dialogue">Messieurs, la série Holixxod a semé la panique. Les citoyens pensent que PX-19 va les transformer en zombies. Que fait-on ?</div>
<div class="character">GÉNÉRAL</div>
<div class="dialogue">On pourrait simplement expliquer que c'est une fiction et que la bactérie est inoffensive.</div>

let currentSpread = 0;
let isOpen = false;
let isAnimating = false;
const TOTAL_SPREADS = spreads.length;

const cover         = document.getElementById('cover-container');
const flipContainer = document.getElementById('flip-container');
const flipFront     = document.getElementById('flip-front-content');
const flipBack      = document.getElementById('flip-back-content');
const leftContent   = document.getElementById('left-content');
const navPrev       = document.getElementById('nav-prev');
const navNext       = document.getElementById('nav-next');
const indicator     = document.getElementById('page-indicator');

function renderSpread(index) {
  const s = spreads[index];
  leftContent.innerHTML = s.left;
  flipFront.innerHTML   = s.right;
  document.getElementById('pages-stack-content').innerHTML =
    (index + 1 < TOTAL_SPREADS) ? spreads[index + 1].right : '';
  if (index + 1 < TOTAL_SPREADS) {
    flipBack.innerHTML = spreads[index + 1].left;
  } else {
    flipBack.innerHTML = '<div class="page-content"><div style="display:flex;align-items:center;justify-content:center;height:100%;"><div style="font-family:\'Courier Prime\',monospace;font-size:12px;color:#aaa;letter-spacing:2px;">FIN DU SCRIPT</div></div></div>';
  }
  updateNav();
  updateIndicator();
}

function updateNav() {
  navPrev.classList.toggle('hidden', currentSpread <= 0);
  navNext.classList.toggle('hidden', currentSpread >= TOTAL_SPREADS - 1);
}

function updateIndicator() {
  if (!isOpen) { indicator.style.display = 'none'; return; }
  indicator.style.display = 'block';
  indicator.textContent = 'Pages ' + (currentSpread * 2 + 2) + '-' + (currentSpread * 2 + 3) + ' / ' + (TOTAL_SPREADS * 2 + 1);
}

function openBook() {
  if (isOpen || isAnimating) return;
  isAnimating = true;

  leftContent.innerHTML = spreads[0].left;
  flipFront.innerHTML   = spreads[0].right;
  document.getElementById('pages-stack-content').innerHTML = (1 < spreads.length) ? spreads[1].right : '';
  flipBack.innerHTML = (1 < spreads.length) ? spreads[1].left : '';

  document.getElementById('cover-back-content').innerHTML = spreads[0].left;
  document.getElementById('left-page').style.display   = 'none';
  document.getElementById('pages-stack').style.display = 'none';
  flipContainer.style.display = 'none';

  cover.querySelector('.cover-click-hint').style.display = 'none';
  cover.classList.add('opening');

  setTimeout(function() {
    var leftPage = document.getElementById('left-page');
    var stack = document.getElementById('pages-stack');
    leftPage.style.display = 'block';
    stack.style.display = 'block';
    flipContainer.style.display = 'block';
    cover.classList.remove('opening');
    cover.classList.add('opened');
    cover.style.display = 'none';
    stack.classList.add('revealing');
    flipContainer.classList.add('revealing');
    setTimeout(function() {
      stack.classList.remove('revealing');
      flipContainer.classList.remove('revealing');
    }, 460);
    isOpen = true; isAnimating = false;
    currentSpread = 0;
    updateNav();
    navPrev.classList.add('hidden');
    navNext.classList.remove('hidden');
    indicator.style.display = 'block';
    updateIndicator();
  }, 1350);
}

function doFlip(direction) {
  if (isAnimating) return;
  if (direction === 'next' && currentSpread >= TOTAL_SPREADS - 1) return;
  if (direction === 'prev' && currentSpread <= 0) return;

  isAnimating = true;
  flipContainer.style.transition = 'transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1.000)';

  if (direction === 'next') {
    flipBack.innerHTML = (currentSpread + 1 < TOTAL_SPREADS)
      ? spreads[currentSpread + 1].left
      : '<div class="page-content"><div style="display:flex;align-items:center;justify-content:center;height:100%;"><div style="font-family:\'Courier Prime\',monospace;font-size:12px;color:#aaa;">FIN</div></div></div>';

    document.getElementById('pages-stack-content').innerHTML = (currentSpread + 1 < TOTAL_SPREADS) ? spreads[currentSpread + 1].right : '';
    flipContainer.style.transform = 'rotateY(-180deg)';

    setTimeout(function() {
      currentSpread++;
      flipContainer.style.transition = 'none';
      flipContainer.style.transform = 'rotateY(0deg)';
      renderSpread(currentSpread);
      isAnimating = false;
    }, 920);

  } else {
    document.getElementById('pages-stack-content').innerHTML = spreads[currentSpread].right;
    leftContent.innerHTML = spreads[currentSpread - 1].left;
    flipFront.innerHTML   = spreads[currentSpread].left;
    flipBack.innerHTML    = spreads[currentSpread - 1].right;
    flipContainer.style.transition = 'none';
    flipContainer.style.left = 'auto';
    flipContainer.style.right = '50%';
    flipContainer.style.transformOrigin = 'right center';
    flipContainer.style.transform = 'rotateY(0deg)';
    void flipContainer.offsetWidth;
    flipContainer.style.transition = 'transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1.000)';
    requestAnimationFrame(function() {
      flipContainer.style.transform = 'rotateY(180deg)';
    });
    setTimeout(function() {
      currentSpread--;
      flipContainer.style.transition = 'none';
      flipContainer.style.left = '50%';
      flipContainer.style.right = 'auto';
      flipContainer.style.transformOrigin = 'left center';
      flipContainer.style.transform = 'rotateY(0deg)';
      flipFront.innerHTML = spreads[currentSpread].right;
      document.getElementById('pages-stack-content').innerHTML =
        (currentSpread + 1 < TOTAL_SPREADS) ? spreads[currentSpread + 1].right : '';
      if (currentSpread + 1 < TOTAL_SPREADS)
        flipBack.innerHTML = spreads[currentSpread + 1].left;
      updateNav();
      updateIndicator();
      isAnimating = false;
    }, 920);
  }
}

function flipNext() { doFlip('next'); }
function flipPrev() { doFlip('prev'); }

cover.addEventListener('click', openBook);

document.addEventListener('keydown', function(e) {
  if (!isOpen) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') flipNext();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   flipPrev();
});

flipFront.innerHTML   = '';
flipBack.innerHTML    = '';
leftContent.innerHTML = '';
</script>
